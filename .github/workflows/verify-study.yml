name: Verify published study

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify OpenEMR archive and recorded runs
        run: python3 openemr-study/verify.py
      - name: Verify Snyk Code scan archive and scores
        run: python3 openemr-study/snyk-baseline/verify.py
      - name: Verify published PowerPoint archive
        run: python3 -m zipfile -t presentation/Who_Writes_the_Bug.pptx
      - name: Test Jev routing tools
        run: python3 -m unittest discover -s quadrant-tool -p 'test_jev*.py'
